# Mosquitto MQTT Broker Configuration for ControlCore
# https://mosquitto.org/man/mosquitto-conf-5.html

# =============================================================================
# General Settings
# =============================================================================

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# =============================================================================
# Default Listener (MQTT on port 1883)
# =============================================================================

listener 1883
protocol mqtt

# Allow anonymous connections (for development)
# In production, set to false and configure authentication
allow_anonymous true

# =============================================================================
# WebSocket Listener (port 9001 for web clients)
# =============================================================================

listener 9001
protocol websockets

# =============================================================================
# Security (commented out for development)
# Uncomment and configure for production
# =============================================================================

# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl

# =============================================================================
# Message Settings
# =============================================================================

# Maximum message size (256KB default, increase if needed)
message_size_limit 262144

# Maximum queued messages per client
max_queued_messages 1000

# Retain messages
retain_available true

# =============================================================================
# Client Settings
# =============================================================================

# Maximum concurrent client connections (0 = unlimited)
max_connections 100

# Keepalive settings
max_keepalive 120

# =============================================================================
# Bridge Configuration (for connecting to external brokers)
# Uncomment if you need to bridge to another MQTT broker
# =============================================================================

# connection external-broker
# address external.broker.com:1883
# topic controlcore/# out 1
# topic external/# in 1
