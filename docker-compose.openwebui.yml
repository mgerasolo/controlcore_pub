version: '3.8'

services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: forecaster-openwebui
    ports:
      - "3351:8080"
    environment:
      # Disable Ollama (we use our own API)
      - ENABLE_OLLAMA_API=false
      # Point to Sauron as OpenAI-compatible API
      - OPENAI_API_BASE_URL=http://sauron:3352/v1
      - OPENAI_API_KEY=not-needed
      # Branding
      - WEBUI_NAME=Middle Earth Forecaster
      # Disable signup (optional - can change to true)
      - ENABLE_SIGNUP=true
      - ENABLE_LOGIN_FORM=true
    volumes:
      - openwebui-data:/app/backend/data
      # Mount custom icons for branding
      - ./icons/icons8-gandalf-96.png:/app/backend/static/assets/images/logo.png:ro
      - ./icons/icons8-gandalf-96.png:/app/backend/static/favicon.png:ro
    depends_on:
      - sauron
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Include Sauron for networking
  sauron:
    build:
      context: .
      dockerfile: Dockerfile.sauron
    container_name: forecaster-sauron
    ports:
      - "3352:3352"
    environment:
      - PG_HOST=10.0.0.33
      - PG_PORT=3353
      - PG_USER=forecaster
      - PG_PASSWORD=${PG_PASSWORD:-sFYBPpjxqkizSuASKpcK8U8r}
      - GANDALF_SQL_URL=http://gandalf:3354/generate-sql
      - GANDALF_ANALYZE_URL=http://gandalf:3354/analyze
      - GANDALF_REPHRASE_URL=http://gandalf:3354/rephrase
      # MQTT configuration
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
      - MQTT_TOPIC=controlcore/#
    depends_on:
      - gandalf
      - mqtt
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3352/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  gandalf:
    build:
      context: .
      dockerfile: Dockerfile.gandalf
    container_name: forecaster-gandalf
    ports:
      - "3354:3354"
    environment:
      - LITELLM_API_URL=http://10.0.0.27:2764/v1
      - LITELLM_API_KEY=${LITELLM_API_KEY:-sk-21cFr6t5HDbW-KxJY8NbWg}
      - LITELLM_SQL_MODEL=jarvis-sqlcoder
      - LITELLM_SUMMARY_MODEL=jarvis-llama31
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3354/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MQTT Broker - Message hub for IoT nodes
  mqtt:
    image: eclipse-mosquitto:2
    container_name: forecaster-mqtt
    ports:
      - "1883:1883"    # MQTT standard port
      - "9001:9001"    # WebSocket port (for web clients)
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  openwebui-data:
  mosquitto-data:
  mosquitto-log:

networks:
  default:
    name: forecaster-network
